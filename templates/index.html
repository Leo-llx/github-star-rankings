<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 星标排行榜</title>
<style>
{{ css }}
</style>
</head>
<body>
<header class="header">
  <div class="container">
    <a href="." class="logo">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>GitHub 星标排行榜</span>
    </a>
    <span class="header-meta">更新于 {{ generated_at }}</span>
  </div>
</header>

<main class="container">

  <section class="filters">
    <div class="filter-row">
      <div class="filter-group filter-search">
        <input type="text" id="search-input" placeholder="搜索仓库名称或描述..." autocomplete="off" class="input">
      </div>
      <div class="filter-group">
        <select id="category-select" class="input">
          <option value="">全部类别</option>
        </select>
      </div>
      <div class="filter-group">
        <select id="lang-select" class="input">
          <option value="">全部语言</option>
          {% for lang in languages %}
          {% if lang %}
          <option value="{{ lang }}">{{ lang }}</option>
          {% endif %}
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <div class="tab-group" id="time-tabs">
          {% for key, label in time_ranges.items() %}
          <button type="button" class="tab" data-time="{{ key }}">{{ label }}</button>
          {% endfor %}
        </div>
      </div>
      <div class="filter-group">
        <div class="tab-group" id="sort-tabs">
          <button type="button" class="tab active" data-sort="stars">按星标</button>
          <button type="button" class="tab" data-sort="forks">按 Forks</button>
        </div>
      </div>
    </div>
  </section>

  <section class="discovery" id="discovery-section">
    <div class="discovery-header">
      <span class="discovery-title">随机发现</span>
      <button type="button" class="discovery-refresh" id="discovery-refresh">换一批</button>
    </div>
    <div class="discovery-cards" id="discovery-cards"></div>
  </section>

  <section class="rankings">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th class="col-repo">仓库</th>
            <th class="col-stars">星标</th>
            <th class="col-lang">语言</th>
            <th class="col-forks">Forks</th>
            <th class="col-desc hide-mobile">描述</th>
          </tr>
        </thead>
        <tbody id="repo-tbody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="empty-state" style="display:none">
      <p>没有找到符合条件的仓库。</p>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container">
    <p>数据来自 <a href="https://docs.github.com/en/rest" target="_blank" rel="noopener">GitHub API</a> &middot; <a href="https://github.com/Leo-llx/github-star-rankings" target="_blank" rel="noopener">源代码</a></p>
  </div>
</footer>

<script>
var ALL_REPOS = {{ repos | tojson | safe }};

var LANG_COLORS = {
  "Python": "#3572A5", "JavaScript": "#f1e05a", "TypeScript": "#3178c6", "Go": "#00ADD8",
  "Rust": "#dea584", "Java": "#b07219", "C++": "#f34b7d", "C": "#555", "C#": "#178600",
  "Ruby": "#701516", "Swift": "#F05138", "Kotlin": "#A97BFF", "PHP": "#4F5D95",
  "R": "#198CE7", "Shell": "#89e051", "Vue": "#41b883", "HTML": "#e34c26", "CSS": "#563d7c",
  "Dart": "#00B4AB", "Lua": "#000080", "Zig": "#ec915c", "Elixir": "#6e4a7e",
  "Jupyter Notebook": "#DA5B0B", "Markdown": "#083fa1", "Scala": "#c22d40",
  "Haskell": "#5e5086", "Clojure": "#db5855", "Erlang": "#B83998", "Julia": "#a270ba"
};

var CATEGORIES = [
  { value: "ai", label: "AI / 机器学习", topics: ["ai","artificial-intelligence","machine-learning","deep-learning","llm","gpt","neural-network","nlp","computer-vision","ml","agent","agentic-ai","agents","autonomous-agents","openai","chatbot","transformer","rag","langchain","prompt-engineering","generative-ai","stable-diffusion","llama","gpt-4","copilot"] },
  { value: "frontend", label: "前端 / Web", topics: ["react","vue","angular","svelte","frontend","web","website","web-development","webapp","ui","ux","css","html","tailwindcss","bootstrap","nextjs","nuxt","sveltekit","jamstack","vite","webpack"] },
  { value: "backend", label: "后端 / 框架", topics: ["backend","api","server","rest","graphql","microservices","framework","django","flask","fastapi","spring","spring-boot","express","nestjs","laravel","rails","gin","fiber","echo","grpc"] },
  { value: "devops", label: "DevOps / 云原生", topics: ["docker","kubernetes","devops","cloud","aws","azure","gcp","terraform","ansible","ci-cd","jenkins","github-actions","prometheus","grafana","monitoring","container","helm","istio","serverless"] },
  { value: "tools", label: "开发工具", topics: ["cli","editor","ide","vim","neovim","vscode","devtools","terminal","compiler","debugging","testing","plugin","extension","package-manager","build-tool","linter","formatter"] },
  { value: "data", label: "数据 / 数据库", topics: ["database","sql","postgresql","mysql","mongodb","redis","sqlite","data-science","data","analytics","visualization","big-data","etl","elasticsearch","kafka","clickhouse"] },
  { value: "systems", label: "系统 / 底层", topics: ["linux","kernel","os","operating-system","embedded","systems-programming","assembly","c","cpp","rust","zig","wasm","webassembly","cgo","ffi"] },
  { value: "security", label: "安全", topics: ["security","hacking","cybersecurity","encryption","penetration-testing","owasp","cryptography","privacy","authentication","authorization","oauth","jwt"] },
  { value: "mobile", label: "移动开发", topics: ["android","ios","mobile","swift","kotlin","flutter","react-native","dart","objective-c","mobile-app"] },
  { value: "game", label: "游戏", topics: ["game","game-development","game-engine","unity","unreal-engine","godot","gaming","gamedev","opengl","vulkan","sdl2","raylib"] },
  { value: "learning", label: "学习资源", topics: ["awesome-list","awesome","tutorial","course","curriculum","book","books","education","learning","interview","coding-interview","roadmap","cheatsheet","best-practices"] },
  { value: "algorithm", label: "算法 / 数学", topics: ["algorithm","algorithms","data-structures","competitive-programming","leetcode","math","mathematics","statistics","computer-science","design-patterns"] }
];

function fmt(n) { return n.toLocaleString('en-US'); }

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function daysAgo(dateStr, n) {
  if (!dateStr) return false;
  return (Date.now() - new Date(dateStr + 'T00:00:00Z')) <= n * 86400000;
}

function langColor(lang) { return LANG_COLORS[lang] || '#8b949e'; }

function langDot(lang) {
  if (!lang || lang === 'Unknown') return '';
  return '<span class="lang-dot" style="background-color:' + langColor(lang) + '"></span>';
}

// --- Category filter ---

var currentCategory = '';

function matchCategory(repo, catValue) {
  if (!catValue) return true;
  var cat = CATEGORIES.find(function(c) { return c.value === catValue; });
  if (!cat || !repo.topics) return false;
  return repo.topics.some(function(t) {
    return cat.topics.indexOf(t.toLowerCase()) !== -1;
  });
}

function buildCategorySelect() {
  // Collect available categories from the data
  var sel = document.getElementById('category-select');
  var counts = {};
  ALL_REPOS.forEach(function(r) {
    if (!r.topics) return;
    CATEGORIES.forEach(function(cat) {
      if (matchCategory(r, cat.value)) {
        counts[cat.value] = (counts[cat.value] || 0) + 1;
      }
    });
  });
  CATEGORIES.forEach(function(cat) {
    var cnt = counts[cat.value] || 0;
    var opt = document.createElement('option');
    opt.value = cat.value;
    opt.textContent = cat.label + ' (' + cnt + ')';
    sel.appendChild(opt);
  });
}

// --- Filter logic ---

var currentSort = 'stars';
var currentTime = '{{ current_time_range }}';

function getFilteredRepos() {
  var lang = document.getElementById('lang-select').value;
  var search = document.getElementById('search-input').value.toLowerCase().trim();

  var filtered = ALL_REPOS.filter(function(r) {
    if (lang && r.language !== lang) return false;
    if (currentCategory && !matchCategory(r, currentCategory)) return false;
    if (currentTime === 'daily')   return daysAgo(r.pushed_at, 1);
    if (currentTime === 'weekly')  return daysAgo(r.pushed_at, 7);
    if (currentTime === 'monthly') return daysAgo(r.pushed_at, 30);
    return true;
  });

  if (search) {
    filtered = filtered.filter(function(r) {
      return r.name.toLowerCase().indexOf(search) !== -1 ||
             (r.description || '').toLowerCase().indexOf(search) !== -1 ||
             (r.description_cn || '').indexOf(search) !== -1;
    });
  }

  filtered.sort(function(a, b) {
    return currentSort === 'forks' ? b.forks - a.forks : b.stars - a.stars;
  });

  return filtered;
}

// --- Topics rendering ---

function renderTopics(topics) {
  if (!topics || !topics.length) return '';
  return topics.map(function(t) {
    return '<span class="topic-tag">' + escapeHtml(t) + '</span>';
  }).join(' ');
}

// --- Expandable row ---

var expandedRow = null;

function toggleExpand(repoEl, repo, i) {
  if (expandedRow && expandedRow !== repoEl) {
    expandedRow.classList.remove('expanded');
    var pd = expandedRow.nextElementSibling;
    if (pd && pd.classList.contains('detail-row')) pd.remove();
  }

  var existing = repoEl.nextElementSibling;
  if (existing && existing.classList.contains('detail-row')) {
    repoEl.classList.remove('expanded');
    existing.remove();
    expandedRow = null;
    return;
  }

  repoEl.classList.add('expanded');
  expandedRow = repoEl;

  var topicsSection = repo.topics && repo.topics.length
    ? '<div class="detail-section"><div class="detail-label">Topics</div><div class="topics-inline">' + renderTopics(repo.topics) + '</div></div>'
    : '';

  var detail = document.createElement('tr');
  detail.className = 'detail-row';
  detail.innerHTML = '<td colspan="6"><div class="detail-panel">' +
    '<div class="detail-grid">' +
      '<div class="detail-item"><span class="detail-label">创建时间</span><span class="detail-val">' + (repo.created_at || '—') + '</span></div>' +
      '<div class="detail-item"><span class="detail-label">最近更新</span><span class="detail-val">' + (repo.pushed_at || '—') + '</span></div>' +
      '<div class="detail-item"><span class="detail-label">Open Issues</span><span class="detail-val">' + fmt(repo.open_issues || 0) + '</span></div>' +
      '<div class="detail-item"><span class="detail-label">星标</span><span class="detail-val">' + fmt(repo.stars) + '</span></div>' +
      '<div class="detail-item"><span class="detail-label">Forks</span><span class="detail-val">' + fmt(repo.forks) + '</span></div>' +
      '<div class="detail-item"><span class="detail-label">语言</span><span class="detail-val">' + langDot(repo.language) + escapeHtml(repo.language || '—') + '</span></div>' +
    '</div>' +
    topicsSection +
    '<div class="detail-desc">' + escapeHtml(repo.description_cn || repo.description || '暂无描述') + '</div>' +
    '<a href="' + escapeHtml(repo.url) + '" target="_blank" rel="noopener" class="detail-link">GitHub &rarr;</a>' +
  '</div></td>';
  repoEl.parentNode.insertBefore(detail, repoEl.nextSibling);
}

// --- Render table ---

function renderTable(repos) {
  var tbody = document.getElementById('repo-tbody');
  var empty = document.getElementById('empty-state');
  expandedRow = null;

  if (!repos.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = repos.map(function(r, i) {
    var desc = escapeHtml(r.description_cn || r.description || '');
    var descShort = desc.length > 90 ? desc.slice(0, 90) + '...' : desc;
    var langCell = r.language && r.language !== 'Unknown'
      ? langDot(r.language) + escapeHtml(r.language)
      : '<span class="no-lang">—</span>';
    var topics = r.topics && r.topics.length
      ? '<div class="topics-inline hide-mobile">' + renderTopics(r.topics.slice(0, 3)) + '</div>'
      : '';

    return '<tr class="repo-row" onclick="toggleExpand(this, ALL_REPOS[' + ALL_REPOS.indexOf(r) + '], ' + i + ')">' +
      '<td class="col-rank"><span class="rank-badge' + (i < 3 ? ' r' + (i+1) : '') + '">' + (i + 1) + '</span></td>' +
      '<td class="col-repo">' +
        '<a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener" class="repo-link" onclick="event.stopPropagation()">' +
          '<img src="' + escapeHtml(r.avatar) + '&s=36" alt="" class="repo-avatar" loading="lazy">' +
          escapeHtml(r.name) +
        '</a>' +
        '<p class="repo-desc-mobile hide-desktop">' + descShort + '</p>' +
        topics +
      '</td>' +
      '<td class="col-stars"><span class="num">' + fmt(r.stars) + '</span></td>' +
      '<td class="col-lang">' + langCell + '</td>' +
      '<td class="col-forks"><span class="num">' + fmt(r.forks) + '</span></td>' +
      '<td class="col-desc hide-mobile">' + descShort + '</td>' +
    '</tr>';
  }).join('');
}

// --- Discovery cards ---

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function renderDiscovery() {
  var container = document.getElementById('discovery-cards');
  var pool = ALL_REPOS.filter(function(r) { return r.description || r.description_cn; });
  if (pool.length < 3) pool = ALL_REPOS;
  var picks = shuffle(pool).slice(0, 5);

  container.innerHTML = picks.map(function(r) {
    var desc = escapeHtml(r.description_cn || r.description || '');
    return '<div class="discovery-card" onclick="window.open(\'' + escapeHtml(r.url) + '\',\'_blank\')">' +
      '<div class="discovery-card-top">' +
        '<img src="' + escapeHtml(r.avatar) + '&s=40" alt="" class="discovery-avatar" loading="lazy">' +
        '<span class="discovery-name">' + escapeHtml(r.name) + '</span>' +
      '</div>' +
      '<p class="discovery-desc">' + (desc.length > 100 ? desc.slice(0, 100) + '...' : desc) + '</p>' +
      '<div class="discovery-stats">' +
        '<span>' + langDot(r.language) + escapeHtml(r.language || '—') + '</span>' +
        '<span>' + fmt(r.stars) + ' ★</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

// --- Apply ---

function applyFilters() {
  renderTable(getFilteredRepos());
  var hash = 'cat=' + encodeURIComponent(currentCategory) +
             '&lang=' + encodeURIComponent(document.getElementById('lang-select').value) +
             '&time=' + currentTime + '&sort=' + currentSort;
  window.location.hash = hash;
}

function restoreFromHash() {
  var raw = window.location.hash.replace(/^#/, '');
  var params = {};
  raw.split('&').forEach(function(p) {
    var parts = p.split('=');
    if (parts.length === 2) params[parts[0]] = decodeURIComponent(parts[1]);
  });
  if (params.lang !== undefined) document.getElementById('lang-select').value = params.lang;
  if (params.cat !== undefined) {
    currentCategory = params.cat;
    document.getElementById('category-select').value = params.cat;
  }
  if (params.time) {
    currentTime = params.time;
    document.querySelectorAll('#time-tabs .tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-time') === params.time);
    });
  }
  if (params.sort) {
    currentSort = params.sort;
    document.querySelectorAll('#sort-tabs .tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-sort') === params.sort);
    });
  }
  applyFilters();
}

document.addEventListener('DOMContentLoaded', function() {
  buildCategorySelect();

  var searchTimer;
  document.getElementById('search-input').addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 180);
  });

  document.getElementById('lang-select').addEventListener('change', applyFilters);

  document.getElementById('category-select').addEventListener('change', function() {
    currentCategory = this.value;
    applyFilters();
  });

  document.querySelectorAll('#time-tabs .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#time-tabs .tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentTime = tab.getAttribute('data-time');
      applyFilters();
    });
  });

  document.querySelectorAll('#sort-tabs .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#sort-tabs .tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentSort = tab.getAttribute('data-sort');
      applyFilters();
    });
  });

  document.getElementById('discovery-refresh').addEventListener('click', function(e) {
    e.stopPropagation();
    renderDiscovery();
  });

  var defaultTab = document.querySelector('#time-tabs .tab[data-time="' + currentTime + '"]');
  if (defaultTab) defaultTab.classList.add('active');
  else document.querySelector('#time-tabs .tab').classList.add('active');

  if (window.location.hash) {
    restoreFromHash();
  } else {
    applyFilters();
  }
  renderDiscovery();
});
</script>
</body>
</html>
