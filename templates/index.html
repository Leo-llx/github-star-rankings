<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 星标排行榜</title>
<style>
{{ css }}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<header class="header">
  <div class="container">
    <a href="." class="logo">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>GitHub 星标排行榜</span>
    </a>
    <span class="header-meta">更新于 {{ generated_at }}</span>
  </div>
</header>

<main class="container" id="main-content">

  <section class="filters">
    <div class="filter-row">
      <div class="filter-group filter-search">
        <input type="text" id="search-input" placeholder="搜索仓库名称或描述..." autocomplete="off" class="input">
      </div>
      <div class="filter-group">
        <select id="category-select" class="input">
          <option value="">全部类别</option>
        </select>
      </div>
      <div class="filter-group">
        <select id="lang-select" class="input">
          <option value="">全部语言</option>
          {% for lang in languages %}
          {% if lang %}
          <option value="{{ lang }}">{{ lang }}</option>
          {% endif %}
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <div class="tab-group" id="time-tabs">
          {% for key, label in time_ranges.items() %}
          <button type="button" class="tab" data-time="{{ key }}">{{ label }}</button>
          {% endfor %}
        </div>
      </div>
      <div class="filter-group">
        <div class="tab-group" id="sort-tabs">
          <button type="button" class="tab active" data-sort="stars">按星标</button>
          <button type="button" class="tab" data-sort="forks">按 Forks</button>
        </div>
      </div>
    </div>
  </section>

  <section class="discovery" id="discovery-section">
    <div class="discovery-header">
      <span class="discovery-title">随机发现</span>
      <button type="button" class="discovery-refresh" id="discovery-refresh">换一批</button>
    </div>
    <div class="discovery-cards" id="discovery-cards"></div>
  </section>

  <section class="rankings">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th class="col-repo">仓库</th>
            <th class="col-stars">星标</th>
            <th class="col-lang">语言</th>
            <th class="col-forks">Forks</th>
            <th class="col-desc hide-mobile">描述</th>
          </tr>
        </thead>
        <tbody id="repo-tbody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="empty-state" style="display:none">
      <p>没有找到符合条件的仓库。</p>
    </div>
  </section>

</main>

<footer class="footer" id="main-footer">
  <div class="container">
    <p>数据来自 <a href="https://docs.github.com/en/rest" target="_blank" rel="noopener">GitHub API</a> &middot; <a href="https://github.com/Leo-llx/github-star-rankings" target="_blank" rel="noopener">源代码</a></p>
  </div>
</footer>

<!-- Detail overlay -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-container" id="detail-container"></div>
</div>

<script>
var ALL_REPOS = {{ repos | tojson | safe }};

var LANG_COLORS = {
  "Python": "#3572A5", "JavaScript": "#f1e05a", "TypeScript": "#3178c6", "Go": "#00ADD8",
  "Rust": "#dea584", "Java": "#b07219", "C++": "#f34b7d", "C": "#555", "C#": "#178600",
  "Ruby": "#701516", "Swift": "#F05138", "Kotlin": "#A97BFF", "PHP": "#4F5D95",
  "R": "#198CE7", "Shell": "#89e051", "Vue": "#41b883", "HTML": "#e34c26", "CSS": "#563d7c",
  "Dart": "#00B4AB", "Lua": "#000080", "Zig": "#ec915c", "Elixir": "#6e4a7e",
  "Jupyter Notebook": "#DA5B0B", "Markdown": "#083fa1", "Scala": "#c22d40",
  "Haskell": "#5e5086", "Clojure": "#db5855", "Erlang": "#B83998", "Julia": "#a270ba"
};

var CATEGORIES = [
  { value: "ai", label: "AI / 机器学习", topics: ["ai","artificial-intelligence","machine-learning","deep-learning","llm","gpt","neural-network","nlp","computer-vision","ml","agent","agentic-ai","agents","autonomous-agents","openai","chatbot","transformer","rag","langchain","prompt-engineering","generative-ai","stable-diffusion","llama","gpt-4","copilot"] },
  { value: "frontend", label: "前端 / Web", topics: ["react","vue","angular","svelte","frontend","web","website","web-development","webapp","ui","ux","css","html","tailwindcss","bootstrap","nextjs","nuxt","sveltekit","jamstack","vite","webpack"] },
  { value: "backend", label: "后端 / 框架", topics: ["backend","api","server","rest","graphql","microservices","framework","django","flask","fastapi","spring","spring-boot","express","nestjs","laravel","rails","gin","fiber","echo","grpc"] },
  { value: "devops", label: "DevOps / 云原生", topics: ["docker","kubernetes","devops","cloud","aws","azure","gcp","terraform","ansible","ci-cd","jenkins","github-actions","prometheus","grafana","monitoring","container","helm","istio","serverless"] },
  { value: "tools", label: "开发工具", topics: ["cli","editor","ide","vim","neovim","vscode","devtools","terminal","compiler","debugging","testing","plugin","extension","package-manager","build-tool","linter","formatter"] },
  { value: "data", label: "数据 / 数据库", topics: ["database","sql","postgresql","mysql","mongodb","redis","sqlite","data-science","data","analytics","visualization","big-data","etl","elasticsearch","kafka","clickhouse"] },
  { value: "systems", label: "系统 / 底层", topics: ["linux","kernel","os","operating-system","embedded","systems-programming","assembly","c","cpp","rust","zig","wasm","webassembly","cgo","ffi"] },
  { value: "security", label: "安全", topics: ["security","hacking","cybersecurity","encryption","penetration-testing","owasp","cryptography","privacy","authentication","authorization","oauth","jwt"] },
  { value: "mobile", label: "移动开发", topics: ["android","ios","mobile","swift","kotlin","flutter","react-native","dart","objective-c","mobile-app"] },
  { value: "game", label: "游戏", topics: ["game","game-development","game-engine","unity","unreal-engine","godot","gaming","gamedev","opengl","vulkan","sdl2","raylib"] },
  { value: "learning", label: "学习资源", topics: ["awesome-list","awesome","tutorial","course","curriculum","book","books","education","learning","interview","coding-interview","roadmap","cheatsheet","best-practices"] },
  { value: "algorithm", label: "算法 / 数学", topics: ["algorithm","algorithms","data-structures","competitive-programming","leetcode","math","mathematics","statistics","computer-science","design-patterns"] }
];

function fmt(n) { return n.toLocaleString('en-US'); }
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function daysAgo(d, n) {
  if (!d) return false;
  return (Date.now() - new Date(d + 'T00:00:00Z')) <= n * 86400000;
}
function langColor(l) { return LANG_COLORS[l] || '#8b949e'; }
function langDot(l) {
  if (!l || l === 'Unknown') return '';
  return '<span class="lang-dot" style="background-color:' + langColor(l) + '"></span>';
}

// --- Data access ---

var currentSort = 'stars';
var currentTime = '{{ current_time_range }}';
var currentCategory = '';
var currentDetailRepo = null;

function findRepo(name) {
  for (var i = 0; i < ALL_REPOS.length; i++) {
    if (ALL_REPOS[i].name === name) return ALL_REPOS[i];
  }
  return null;
}

// --- Filters ---

function matchCategory(repo, catVal) {
  if (!catVal) return true;
  var cat = CATEGORIES.find(function(c) { return c.value === catVal; });
  if (!cat || !repo.topics) return false;
  return repo.topics.some(function(t) { return cat.topics.indexOf(t.toLowerCase()) !== -1; });
}

function getFilteredRepos() {
  var lang = document.getElementById('lang-select').value;
  var search = document.getElementById('search-input').value.toLowerCase().trim();
  var filtered = ALL_REPOS.filter(function(r) {
    if (lang && r.language !== lang) return false;
    if (currentCategory && !matchCategory(r, currentCategory)) return false;
    if (currentTime === 'daily')   return daysAgo(r.pushed_at, 1);
    if (currentTime === 'weekly')  return daysAgo(r.pushed_at, 7);
    if (currentTime === 'monthly') return daysAgo(r.pushed_at, 30);
    return true;
  });
  if (search) {
    filtered = filtered.filter(function(r) {
      return r.name.toLowerCase().indexOf(search) !== -1 ||
             (r.description || '').toLowerCase().indexOf(search) !== -1 ||
             (r.description_cn || '').indexOf(search) !== -1;
    });
  }
  filtered.sort(function(a, b) {
    return currentSort === 'forks' ? b.forks - a.forks : b.stars - a.stars;
  });
  return filtered;
}

// --- Table ---

function buildCategorySelect() {
  var sel = document.getElementById('category-select');
  var counts = {};
  ALL_REPOS.forEach(function(r) {
    if (!r.topics) return;
    CATEGORIES.forEach(function(cat) {
      if (matchCategory(r, cat.value)) counts[cat.value] = (counts[cat.value] || 0) + 1;
    });
  });
  CATEGORIES.forEach(function(cat) {
    var opt = document.createElement('option');
    opt.value = cat.value;
    opt.textContent = cat.label + ' (' + (counts[cat.value] || 0) + ')';
    sel.appendChild(opt);
  });
}

function renderTable(repos) {
  var tbody = document.getElementById('repo-tbody');
  var empty = document.getElementById('empty-state');
  if (!repos.length) { tbody.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  tbody.innerHTML = repos.map(function(r, i) {
    var desc = esc(r.description_cn || r.description || '');
    var descShort = desc.length > 90 ? desc.slice(0, 90) + '...' : desc;
    var langCell = r.language && r.language !== 'Unknown'
      ? langDot(r.language) + esc(r.language) : '<span class="no-lang">—</span>';
    return '<tr class="repo-row" data-repo="' + esc(r.name) + '" onclick="openDetail(\'' + esc(r.name) + '\')">' +
      '<td class="col-rank"><span class="rank-badge' + (i < 3 ? ' r' + (i+1) : '') + '">' + (i + 1) + '</span></td>' +
      '<td class="col-repo">' +
        '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" class="repo-link" onclick="event.stopPropagation()">' +
          '<img src="' + esc(r.avatar) + '&s=36" alt="" class="repo-avatar" loading="lazy">' + esc(r.name) +
        '</a>' +
        '<p class="repo-desc-mobile hide-desktop">' + descShort + '</p>' +
      '</td>' +
      '<td class="col-stars"><span class="num">' + fmt(r.stars) + '</span></td>' +
      '<td class="col-lang">' + langCell + '</td>' +
      '<td class="col-forks"><span class="num">' + fmt(r.forks) + '</span></td>' +
      '<td class="col-desc hide-mobile">' + descShort + '</td>' +
    '</tr>';
  }).join('');
}

// --- Discovery ---

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}

function renderDiscovery() {
  var pool = ALL_REPOS.filter(function(r) { return r.description || r.description_cn; });
  if (pool.length < 3) pool = ALL_REPOS;
  var picks = shuffle(pool).slice(0, 5);
  document.getElementById('discovery-cards').innerHTML = picks.map(function(r) {
    var desc = esc(r.description_cn || r.description || '');
    return '<div class="discovery-card" onclick="openDetail(\'' + esc(r.name) + '\')">' +
      '<div class="discovery-card-top">' +
        '<img src="' + esc(r.avatar) + '&s=40" alt="" class="discovery-avatar" loading="lazy">' +
        '<span class="discovery-name">' + esc(r.name) + '</span>' +
      '</div>' +
      '<p class="discovery-desc">' + (desc.length > 100 ? desc.slice(0, 100) + '...' : desc) + '</p>' +
      '<div class="discovery-stats">' +
        '<span>' + langDot(r.language) + esc(r.language || '—') + '</span>' +
        '<span>' + fmt(r.stars) + ' ★</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

// --- Detail page ---

function getRelated(repo, count) {
  if (!repo.topics || !repo.topics.length) return [];
  var scored = [];
  for (var i = 0; i < ALL_REPOS.length; i++) {
    var other = ALL_REPOS[i];
    if (other.name === repo.name || !other.topics) continue;
    var overlap = 0;
    for (var j = 0; j < repo.topics.length; j++) {
      if (other.topics.indexOf(repo.topics[j]) !== -1) overlap++;
    }
    if (overlap >= 1) scored.push({ repo: other, score: overlap });
  }
  scored.sort(function(a, b) { return b.score - a.score || b.repo.stars - a.repo.stars; });
  return scored.slice(0, count || 6);
}

function openDetail(name) {
  var repo = findRepo(name);
  if (!repo) return;
  currentDetailRepo = repo;

  var desc = esc(repo.description_cn || repo.description || '暂无描述');
  var descEn = repo.description ? esc(repo.description) : '';
  var related = getRelated(repo, 8);

  var html = '<div class="detail-page">' +
    // Header
    '<div class="dp-header">' +
      '<button class="dp-back" id="dp-back">&larr; 返回排行榜</button>' +
      '<a href="' + esc(repo.url) + '" target="_blank" rel="noopener" class="dp-gh-link">GitHub 主页 ↗</a>' +
    '</div>' +

    // Hero
    '<div class="dp-hero">' +
      '<img src="' + esc(repo.avatar) + '&s=80" alt="" class="dp-avatar">' +
      '<div class="dp-hero-body">' +
        '<h1 class="dp-name">' + esc(repo.name) + '</h1>' +
        '<div class="dp-lang">' + langDot(repo.language) + esc(repo.language || 'Unknown') + '</div>' +
        '<div class="dp-stats">' +
          '<div class="dp-stat"><span class="dp-stat-num">' + fmt(repo.stars) + '</span><span class="dp-stat-label">星标</span></div>' +
          '<div class="dp-stat"><span class="dp-stat-num">' + fmt(repo.forks) + '</span><span class="dp-stat-label">Forks</span></div>' +
          '<div class="dp-stat"><span class="dp-stat-num">' + fmt(repo.open_issues || 0) + '</span><span class="dp-stat-label">Issues</span></div>' +
          '<div class="dp-stat"><span class="dp-stat-num">#' + (ALL_REPOS.indexOf(repo) + 1) + '</span><span class="dp-stat-label">排名</span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    // Description
    '<div class="dp-section">' +
      '<h2>简介</h2>' +
      '<p class="dp-desc">' + desc + '</p>' +
      (descEn && descEn !== desc ? '<p class="dp-desc-en">' + descEn + '</p>' : '') +
    '</div>' +

    // Topics
    (repo.topics && repo.topics.length ? '<div class="dp-section">' +
      '<h2>Topics</h2>' +
      '<div class="dp-topics">' + repo.topics.map(function(t) { return '<span class="topic-tag">' + esc(t) + '</span>'; }).join(' ') + '</div>' +
    '</div>' : '') +

    // Meta
    '<div class="dp-section">' +
      '<h2>信息</h2>' +
      '<div class="dp-meta-grid">' +
        '<div class="dp-meta"><span>创建时间</span><strong>' + (repo.created_at || '—') + '</strong></div>' +
        '<div class="dp-meta"><span>最近更新</span><strong>' + (repo.pushed_at || '—') + '</strong></div>' +
        '<div class="dp-meta"><span>Open Issues</span><strong>' + fmt(repo.open_issues || 0) + '</strong></div>' +
      '</div>' +
    '</div>' +

    // Related
    (related.length ? '<div class="dp-section">' +
      '<h2>相关仓库</h2>' +
      '<div class="dp-related">' + related.map(function(item) {
        var r = item.repo;
        return '<div class="dp-related-card" onclick="openDetail(\'' + esc(r.name) + '\')">' +
          '<img src="' + esc(r.avatar) + '&s=32" alt="" class="dp-related-avatar">' +
          '<span class="dp-related-name">' + esc(r.name) + '</span>' +
          '<span class="dp-related-stars">' + fmt(r.stars) + ' ★</span>' +
        '</div>';
      }).join('') + '</div>' +
    '</div>' : '') +

    // README
    '<div class="dp-section">' +
      '<h2>README</h2>' +
      '<div class="dp-readme-wrap" id="dp-readme">' +
        '<p class="dp-readme-loading">加载 README 中...</p>' +
      '</div>' +
    '</div>' +
      '</div>' +
    '</div>' +

  '</div>';

  document.getElementById('detail-container').innerHTML = html;
  document.getElementById('detail-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';

  document.getElementById('dp-back').addEventListener('click', closeDetail);

  window.location.hash = 'repo=' + encodeURIComponent(repo.name);

  // Load README asynchronously
  loadReadme(repo);
}

function loadReadme(repo) {
  var container = document.getElementById('dp-readme');
  if (!container || !window.marked) return;

  var owner = repo.name.split('/')[0];
  var repoName = repo.name.split('/')[1];

  function showError() {
    container.innerHTML = '<p class="dp-readme-info">无法加载 README（可能触发 API 限流）</p>' +
      '<a href="' + esc(repo.url) + '#readme" target="_blank" rel="noopener" class="dp-readme-btn">在 GitHub 查看 README &rarr;</a>';
  }

  function render(md) {
    try {
      var html = window.marked.parse(md);
      container.innerHTML = '<div class="dp-markdown">' + html + '</div>';
    } catch(e) {
      showError();
    }
  }

  // Try GitHub API first
  var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repoName + '/readme';
  fetch(apiUrl, { headers: { Accept: 'application/vnd.github.v3+json' } })
    .then(function(r) {
      if (!r.ok) throw new Error('API failed');
      return r.json();
    })
    .then(function(data) {
      var content = data.content;
      var decoded = atob(content.replace(/\s/g, ''));
      render(decoded);
    })
    .catch(function() {
      // Fallback: raw.githubusercontent.com
      fetch('https://raw.githubusercontent.com/' + owner + '/' + repoName + '/HEAD/README.md')
        .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
        .then(function(md) { render(md); })
        .catch(function() {
          // Last try: main branch
          fetch('https://raw.githubusercontent.com/' + owner + '/' + repoName + '/main/README.md')
            .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
            .then(function(md) { render(md); })
            .catch(function() {
              // Try master branch
              fetch('https://raw.githubusercontent.com/' + owner + '/' + repoName + '/master/README.md')
                .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
                .then(function(md) { render(md); })
                .catch(showError);
            });
        });
    });
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('active');
  document.body.style.overflow = '';
  currentDetailRepo = null;
  window.location.hash = buildFilterHash();
}

function buildFilterHash() {
  return 'lang=' + encodeURIComponent(document.getElementById('lang-select').value) +
         '&cat=' + encodeURIComponent(currentCategory) +
         '&time=' + currentTime + '&sort=' + currentSort;
}

// --- Apply ---

function applyFilters() {
  renderTable(getFilteredRepos());
  if (!currentDetailRepo) window.location.hash = buildFilterHash();
}

function restoreFromHash() {
  var raw = window.location.hash.replace(/^#/, '');
  // Check if it's a detail page hash
  if (raw.indexOf('repo=') === 0) {
    var repoName = decodeURIComponent(raw.slice(5));
    var repo = findRepo(repoName);
    if (repo) { openDetail(repoName); return; }
  }
  // Otherwise it's filter params
  var params = {};
  raw.split('&').forEach(function(p) {
    var parts = p.split('=');
    if (parts.length === 2) params[parts[0]] = decodeURIComponent(parts[1]);
  });
  if (params.lang !== undefined) document.getElementById('lang-select').value = params.lang;
  if (params.cat !== undefined) { currentCategory = params.cat; document.getElementById('category-select').value = params.cat; }
  if (params.time) {
    currentTime = params.time;
    document.querySelectorAll('#time-tabs .tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-time') === params.time); });
  }
  if (params.sort) {
    currentSort = params.sort;
    document.querySelectorAll('#sort-tabs .tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-sort') === params.sort); });
  }
  applyFilters();
}

// --- Events ---

document.addEventListener('DOMContentLoaded', function() {
  buildCategorySelect();

  var searchTimer;
  document.getElementById('search-input').addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 180);
  });

  document.getElementById('lang-select').addEventListener('change', applyFilters);
  document.getElementById('category-select').addEventListener('change', function() { currentCategory = this.value; applyFilters(); });

  document.querySelectorAll('#time-tabs .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#time-tabs .tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentTime = tab.getAttribute('data-time');
      applyFilters();
    });
  });

  document.querySelectorAll('#sort-tabs .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#sort-tabs .tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentSort = tab.getAttribute('data-sort');
      applyFilters();
    });
  });

  document.getElementById('discovery-refresh').addEventListener('click', function(e) { e.stopPropagation(); renderDiscovery(); });

  // Detail overlay close: backdrop click
  document.getElementById('detail-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeDetail();
  });

  // Esc to close
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && currentDetailRepo) { closeDetail(); }
  });

  // Hash change (browser back/forward)
  window.addEventListener('hashchange', function() {
    if (!currentDetailRepo) restoreFromHash();
  });

  var defaultTab = document.querySelector('#time-tabs .tab[data-time="' + currentTime + '"]');
  if (defaultTab) defaultTab.classList.add('active');
  else document.querySelector('#time-tabs .tab').classList.add('active');

  if (window.location.hash) { restoreFromHash(); }
  else { applyFilters(); }
  renderDiscovery();
});
</script>
</body>
</html>
